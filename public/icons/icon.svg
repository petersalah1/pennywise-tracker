<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="royalBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#1d4ed8" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect width="512" height="512" rx="120" fill="url(#royalBlue)"/>
  <rect width="504" height="504" x="4" y="4" rx="116" fill="none" stroke="#ffffff" stroke-width="8" stroke-opacity="0.18"/>

  <!-- Wallet Graphic -->
  <g filter="url(#shadow)">
    <!-- Main Wallet Outline -->
    <rect x="110" y="140" width="292" height="232" rx="34" fill="none" stroke="#ffffff" stroke-width="21" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Top Flap Horizontal Line -->
    <line x1="110" y1="205" x2="402" y2="205" stroke="#ffffff" stroke-width="21" stroke-linecap="round"/>

    <!-- Inner Card Peeking -->
    <rect x="170" y="110" width="172" height="95" rx="16" fill="none" stroke="#ffffff" stroke-width="17" stroke-opacity="0.8"/>

    <!-- Wallet Clasp on Right -->
    <rect x="305" y="245" width="105" height="70" rx="18" fill="#1d4ed8" stroke="#ffffff" stroke-width="21"/>
    
    <!-- Clasp Center Dot -->
    <circle cx="345" cy="280" r="12" fill="#ffffff"/>
  </g>
</svg>
